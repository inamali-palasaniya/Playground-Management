name: Deploy Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for EXPO_TOKEN
        id: check-token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::EXPO_TOKEN secret is not set or empty in GitHub repository secrets. Skipping EAS update."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        if: steps.check-token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        if: steps.check-token.outputs.has_token == 'true'
        run: npm ci --legacy-peer-deps

      - name: Publish update
        if: steps.check-token.outputs.has_token == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: "https://playground-management-nal2.onrender.com"
        run: |
          eas update --channel production --message "Automated update from GitHub Actions: $(git log -1 --pretty=%B)" --non-interactive
